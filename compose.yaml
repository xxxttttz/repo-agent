services:
  api:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      REDIS_URL: redis://redis:6379/0
      REPO_AGENT_PROVIDER: ${REPO_AGENT_PROVIDER:-mock}
      REPO_AGENT_MODEL: ${REPO_AGENT_MODEL:-}
      REPO_AGENT_API_TOKEN: ${REPO_AGENT_API_TOKEN:-}
      REPO_AGENT_REPAIR_PROFILES: ${REPO_AGENT_REPAIR_PROFILES:-}
      REPO_AGENT_SESSION_TTL: ${REPO_AGENT_SESSION_TTL:-86400}
      REPO_AGENT_SESSION_MAX_TURNS: ${REPO_AGENT_SESSION_MAX_TURNS:-8}
      REPO_AGENT_TASK_TTL: ${REPO_AGENT_TASK_TTL:-604800}
      REPO_AGENT_QUEUE_RECLAIM_MS: ${REPO_AGENT_QUEUE_RECLAIM_MS:-30000}
      REPO_AGENT_WORKSPACE_LOCK_LEASE_MS: ${REPO_AGENT_WORKSPACE_LOCK_LEASE_MS:-30000}
      REPO_AGENT_ENVIRONMENT: ${REPO_AGENT_ENVIRONMENT:-local}
      REPO_AGENT_ENV_ALLOWLIST: ${REPO_AGENT_ENV_ALLOWLIST:-}
      REPO_AGENT_DOCKER_IMAGE: ${REPO_AGENT_DOCKER_IMAGE:-python:3.13-slim}
      REPO_AGENT_DOCKER_NETWORK: ${REPO_AGENT_DOCKER_NETWORK:-none}
      REPO_AGENT_DOCKER_MEMORY: ${REPO_AGENT_DOCKER_MEMORY:-1g}
      REPO_AGENT_DOCKER_CPUS: ${REPO_AGENT_DOCKER_CPUS:-1}
      REPO_AGENT_DOCKER_PIDS_LIMIT: ${REPO_AGENT_DOCKER_PIDS_LIMIT:-256}
      REPO_AGENT_DOCKER_READ_ONLY: ${REPO_AGENT_DOCKER_READ_ONLY:-true}
      REPO_AGENT_DOCKER_PULL: ${REPO_AGENT_DOCKER_PULL:-never}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/workspace/project
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  redis-data:
