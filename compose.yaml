services:
  api:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      REDIS_URL: redis://redis:6379/0
      REPO_AGENT_PROVIDER: ${REPO_AGENT_PROVIDER:-mock}
      REPO_AGENT_MODEL: ${REPO_AGENT_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace/project
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  redis-data:
