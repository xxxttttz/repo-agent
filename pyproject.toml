[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-agent"
version = "0.1.0"
description = "A lightweight coding agent that verifies evidence before completion."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Repo Agent contributors" },
]
dependencies = ["pyyaml>=6", "jinja2>=3.1"]
keywords = ["coding-agent", "software-engineering", "shell", "trajectory", "evidence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2"]

[project.scripts]
repo-agent = "repo_agent.run.local:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repo_agent = ["config/*.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
